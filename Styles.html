<style>
:root {
  --canvas: #DDD8C4;
  --canvas-deep: #CFC9B2;
  --bark: #2B2A21;
  --bark-soft: #4A4738;
  --moss: #4F6B3A;
  --fern: #7E9B5A;
  --leather: #6B4A2F;
  --brass: #B08428;
  --paper: #EDE9DC;
  --rule: rgba(43, 42, 33, 0.18);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--canvas);
  color: var(--bark);
  font-family: 'Bitter', Georgia, serif;
  font-size: 16px;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
}

/* Contour lines. Quiet atmosphere, never a focal point. */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0.5;
  background-image:
    repeating-radial-gradient(circle at 18% 12%,
      transparent 0 26px, rgba(107, 74, 47, 0.11) 26px 27px),
    repeating-radial-gradient(circle at 86% 78%,
      transparent 0 34px, rgba(79, 107, 58, 0.10) 34px 35px);
}

.wrap {
  position: relative;
  z-index: 1;
  max-width: 720px;
  margin: 0 auto;
  padding: 0 18px 72px;
}

/* ------------------------------------------------------------------ type */

h1, h2, h3, .eyebrow, .tab, .btn, .placard {
  font-family: 'Oswald', 'Arial Narrow', sans-serif;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.mono, .score, .countdown, .tag, .meta {
  font-family: 'Space Mono', ui-monospace, monospace;
}

.eyebrow {
  font-size: 11px;
  letter-spacing: 0.22em;
  color: var(--leather);
  margin: 0 0 6px;
}

/* ---------------------------------------------------------------- header */

.masthead {
  background: var(--bark);
  color: var(--paper);
  margin: 0 -18px 22px;
  padding: 26px 22px 22px;
  border-bottom: 3px solid var(--moss);
}

.masthead h1 {
  margin: 0;
  font-size: clamp(28px, 8vw, 44px);
  line-height: 0.95;
  letter-spacing: 0.02em;
}

.masthead h1 span { color: var(--fern); display: block; }

.masthead .sub {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.15em;
  color: var(--canvas-deep);
  margin-top: 10px;
  text-transform: uppercase;
}

/* ------------------------------------------------------------------ tabs */

.tabs {
  display: flex;
  gap: 4px;
  margin: 0 0 22px;
  border-bottom: 2px solid var(--rule);
}

.tab {
  flex: 1;
  background: none;
  border: 0;
  border-bottom: 3px solid transparent;
  margin-bottom: -2px;
  padding: 11px 4px;
  font-size: 12px;
  color: var(--bark-soft);
  cursor: pointer;
}

.tab[aria-selected="true"] {
  color: var(--bark);
  border-bottom-color: var(--moss);
}

.tab:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

/* ----------------------------------------------------------------- cards */

.card {
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 3px;
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: 0 1px 0 rgba(43, 42, 33, 0.06);
}

.placard {
  display: inline-block;
  background: var(--bark);
  color: var(--paper);
  padding: 5px 12px 4px;
  font-size: 13px;
  letter-spacing: 0.14em;
  border-radius: 2px;
}

.countdown {
  font-size: 13px;
  color: var(--leather);
  margin-top: 10px;
}

.countdown strong { color: var(--bark); }
.countdown.urgent { color: #8A5A12; }
.countdown.urgent strong { color: #8A5A12; }

/* --------------------------------------------------------------- prompts */

.prompt {
  border-top: 1px solid var(--rule);
  padding: 16px 0 14px;
  display: flex;
  gap: 14px;
  align-items: flex-start;
}

.prompt:first-of-type { border-top: 0; }

.tag {
  flex: 0 0 auto;
  font-size: 9px;
  letter-spacing: 0.12em;
  padding: 4px 7px;
  border: 1px solid currentColor;
  border-radius: 2px;
  margin-top: 2px;
}

.tag.FIELD { color: var(--moss); }
.tag.EXPEDITION { color: var(--leather); }
.tag.ODDITY { color: var(--brass); }

.prompt-body { flex: 1; min-width: 0; }
.prompt-text { margin: 0 0 10px; font-size: 16px; }

/* ----------------------------------------------------- signature: stamps */

.stamp {
  display: inline-block;
  font-family: 'Oswald', sans-serif;
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--moss);
  border: 2px solid var(--moss);
  border-radius: 2px;
  padding: 3px 9px 2px;
  transform: rotate(-3.5deg);
  opacity: 0.85;
}

.stamp.fresh { animation: thud 340ms cubic-bezier(0.2, 1.4, 0.4, 1) both; }

@keyframes thud {
  0% { transform: rotate(-3.5deg) scale(2.4); opacity: 0; }
  60% { opacity: 0.95; }
  100% { transform: rotate(-3.5deg) scale(1); opacity: 0.85; }
}

/* Stamp slots in the standings: one per prompt, filled or empty. */
.slots { display: inline-flex; gap: 3px; vertical-align: middle; }

.slot {
  width: 9px;
  height: 9px;
  border: 1.5px solid var(--rule);
  border-radius: 1px;
}

.slot.filled { background: var(--moss); border-color: var(--moss); }
.slot.bonus { background: var(--brass); border-color: var(--brass); }

/* --------------------------------------------------------------- buttons */

.btn {
  display: inline-block;
  background: var(--moss);
  color: var(--paper);
  border: 0;
  border-radius: 2px;
  padding: 11px 18px;
  font-size: 13px;
  cursor: pointer;
  transition: background 140ms ease;
}

.btn:hover { background: #415A2F; }
.btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.btn[disabled] { background: var(--canvas-deep); color: var(--bark-soft); cursor: default; }

.btn.ghost {
  background: none;
  color: var(--leather);
  border: 1px solid var(--leather);
}

.btn.ghost:hover { background: rgba(107, 74, 47, 0.08); }

input[type="file"] { display: none; }

.caption-input {
  width: 100%;
  margin-top: 10px;
  padding: 9px 10px;
  font-family: 'Bitter', serif;
  font-size: 14px;
  background: var(--canvas);
  border: 1px solid var(--rule);
  border-radius: 2px;
  color: var(--bark);
}

.caption-input:focus-visible { outline: 2px solid var(--moss); outline-offset: 1px; }

/* ------------------------------------------------------------- standings */

table.board { width: 100%; border-collapse: collapse; }

table.board th {
  font-family: 'Oswald', sans-serif;
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  text-align: left;
  color: var(--leather);
  padding: 0 0 8px;
  border-bottom: 2px solid var(--bark);
}

table.board td {
  padding: 12px 0;
  border-bottom: 1px solid var(--rule);
  vertical-align: middle;
}

table.board td.rank {
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  color: var(--leather);
  width: 26px;
}

table.board td.who { font-weight: 500; }

table.board td.score {
  text-align: right;
  font-family: 'Space Mono', monospace;
  font-weight: 700;
  font-size: 17px;
  white-space: nowrap;
}

tr.leader td.who::after {
  content: '\2691';
  color: var(--brass);
  margin-left: 7px;
  font-size: 14px;
}

tr.self td.who { color: var(--moss); }

.dropped {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--leather);
  opacity: 0.7;
}

/* --------------------------------------------------------------- gallery */

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 10px;
}

.shot {
  position: relative;
  background: var(--paper);
  border: 1px solid var(--rule);
  padding: 7px 7px 9px;
}

.shot img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  display: block;
  background: var(--canvas-deep);
}

.shot .meta {
  font-size: 10px;
  margin-top: 6px;
  color: var(--bark-soft);
  display: flex;
  justify-content: space-between;
  gap: 6px;
}

.shot.winner { border-color: var(--brass); border-width: 2px; }

.shot .ribbon {
  position: absolute;
  top: 12px;
  right: -4px;
  background: var(--brass);
  color: var(--bark);
  font-family: 'Oswald', sans-serif;
  font-size: 9px;
  letter-spacing: 0.12em;
  padding: 3px 8px;
  text-transform: uppercase;
}

.group-head {
  margin: 22px 0 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--rule);
}

.group-head h3 { margin: 0; font-size: 14px; }
.group-head p { margin: 4px 0 0; font-size: 14px; color: var(--bark-soft); }

/* ----------------------------------------------------- claim / identity */

.claim-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 8px;
}

.claim-btn {
  padding: 16px 10px;
  font-size: 15px;
  letter-spacing: 0.08em;
}

.claim-btn:nth-child(even) { background: var(--leather); }
.claim-btn:nth-child(even):hover { background: #573B24; }

.linkish {
  background: none;
  border: 0;
  padding: 0 0 0 8px;
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fern);
  text-decoration: underline;
  cursor: pointer;
}

.linkish:hover { color: var(--paper); }
.linkish:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

/* --------------------------------------------------------- field manual */

.masthead { position: relative; }

.manual-open {
  position: absolute;
  top: 22px;
  right: 20px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 1.5px solid var(--fern);
  background: none;
  color: var(--fern);
  font-family: 'Oswald', sans-serif;
  font-size: 15px;
  line-height: 1;
  cursor: pointer;
  transition: background 140ms ease, color 140ms ease;
}

.manual-open:hover { background: var(--fern); color: var(--bark); }
.manual-open:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

dialog#manual {
  max-width: 520px;
  width: calc(100% - 32px);
  max-height: 86vh;
  overflow-y: auto;
  padding: 26px 24px 24px;
  border: 1px solid var(--rule);
  border-top: 4px solid var(--moss);
  border-radius: 3px;
  background: var(--paper);
  color: var(--bark);
  font-family: 'Bitter', Georgia, serif;
}

dialog#manual::backdrop { background: rgba(43, 42, 33, 0.68); }

dialog#manual h2 {
  margin: 0 0 20px;
  font-size: 22px;
  letter-spacing: 0.03em;
}

/* The week as three legs of a route, not numbered steps. */
.manual-week { border-left: 2px solid var(--rule); padding-left: 16px; }

.leg { position: relative; padding-bottom: 18px; font-size: 14px; line-height: 1.5; }
.leg:last-child { padding-bottom: 0; }

.leg::before {
  content: '';
  position: absolute;
  left: -22px;
  top: 5px;
  width: 9px;
  height: 9px;
  background: var(--moss);
  border-radius: 50%;
}

.leg-when {
  display: block;
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--leather);
  margin-bottom: 3px;
}

.manual-points { width: 100%; border-collapse: collapse; }

.manual-points td {
  padding: 8px 0;
  border-bottom: 1px solid var(--rule);
  font-size: 14px;
}

.manual-points td:last-child {
  text-align: right;
  font-weight: 700;
  color: var(--moss);
}

.manual-list { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.55; }
.manual-list li { margin-bottom: 7px; }

.judge-box {
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px dashed var(--rule);
}

.linkish.dark {
  color: var(--leather);
  padding: 0;
  font-size: 10px;
}

.linkish.dark:hover { color: var(--bark); }

.judge-line {
  margin: 0;
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--moss);
}

.judge-msg {
  margin: 8px 0 0;
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  color: var(--leather);
}

.phase-tag {
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 3px 7px;
  border: 1px solid currentColor;
  border-radius: 2px;
}

.phase-tag.voting { color: var(--moss); background: rgba(79, 107, 58, 0.12); }
.phase-tag.open { color: var(--brass); background: rgba(176, 132, 40, 0.14); }
.phase-tag.upcoming { color: var(--leather); }
.phase-tag.final { color: var(--bark-soft); }

/* --------------------------------------------------------------- voting */

.ballot-call { text-align: center; padding: 24px 20px; }

.vote-howto {
  background: var(--bark);
  color: var(--paper);
  padding: 16px 18px;
  border-left: 4px solid var(--fern);
  margin-bottom: 16px;
}

.vote-howto .eyebrow { color: var(--fern); }
.vote-howto p:last-child { margin: 0; font-size: 14px; line-height: 1.5; }

/* One photo per row while voting, so the button is never off the card. */
.grid.voting { grid-template-columns: 1fr; gap: 18px; }

@media (min-width: 620px) {
  .grid.voting { grid-template-columns: repeat(2, 1fr); }
}

.grid.voting .shot img { aspect-ratio: 4 / 3; }

/* The vote button. Big, solid, and directly under the photo. */
.vote-big {
  display: block;
  width: 100%;
  margin-top: 8px;
  padding: 15px 10px;
  border: 0;
  border-radius: 2px;
  background: var(--moss);
  color: var(--paper);
  font-family: 'Oswald', sans-serif;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 140ms ease;
}

.vote-big:hover { background: #415A2F; }
.vote-big:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }

.vote-big.is-picked {
  background: var(--bark);
  color: var(--fern);
  border: 2px solid var(--fern);
  padding: 13px 10px;
}

.vote-big[disabled] { background: var(--canvas-deep); color: var(--bark-soft); }

.own-label {
  margin: 8px 0 0;
  padding: 14px 10px;
  text-align: center;
  background: var(--canvas);
  border: 1px dashed var(--rule);
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--leather);
}

.shot-tap {
  display: block;
  width: 100%;
  padding: 0;
  border: 0;
  background: none;
  position: relative;
  cursor: pointer;
  font: inherit;
  color: inherit;
}

.shot-tap:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }

.shot.picked { border-color: var(--moss); border-width: 2px; }
.shot.own { opacity: 0.72; }

.ribbon.leather { background: var(--leather); color: var(--paper); }

/* Image loading + failure states */
.img-loading { opacity: 0.35; }

.img-dead {
  min-height: 120px;
  background: var(--canvas-deep);
  position: relative;
}

/* ------------------------------------------------------------- lightbox */

dialog#lightbox {
  border: 0;
  background: none;
  padding: 0;
  max-width: 96vw;
  max-height: 94vh;
}

dialog#lightbox::backdrop { background: rgba(43, 42, 33, 0.9); }

.lb-inner { text-align: center; }

.lb-inner img {
  max-width: 96vw;
  max-height: 78vh;
  display: block;
  margin: 0 auto 12px;
  border: 6px solid var(--paper);
}

.lb-wait {
  color: var(--paper);
  font-family: 'Space Mono', monospace;
  font-size: 13px;
  padding: 40px 20px;
}

/* Sealed: the stamp language, but cold. Nothing to see and it should look it. */
.sealed { text-align: center; padding: 30px 20px; }

.stamp.sealed-stamp {
  color: var(--leather);
  border-color: var(--leather);
  transform: rotate(-8deg);
  font-size: 15px;
  padding: 6px 16px 5px;
  opacity: 0.55;
}

/* ---------------------------------------------------------------- states */

.empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--bark-soft);
}

.empty p { margin: 0 0 14px; }

.notice {
  background: rgba(176, 132, 40, 0.14);
  border-left: 3px solid var(--brass);
  padding: 12px 14px;
  margin-bottom: 14px;
  font-size: 14px;
}

.notice.bad {
  background: rgba(138, 48, 24, 0.1);
  border-left-color: #8A3018;
}

.draft {
  white-space: pre-wrap;
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  line-height: 1.6;
  background: var(--canvas);
  border: 1px dashed var(--rule);
  padding: 12px;
  margin: 8px 0 4px;
}

.spinner {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid rgba(237, 233, 220, 0.4);
  border-top-color: var(--paper);
  border-radius: 50%;
  animation: spin 700ms linear infinite;
  vertical-align: -2px;
  margin-right: 7px;
}

@keyframes spin { to { transform: rotate(360deg); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
